name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check
        run: pnpm run check

  # Build the production image, smoke-test it boots and serves, then push to the
  # self-hosted registry. Runs on native amd64 (no QEMU) after `ci` passes, and
  # only on main. Mirrors the vernaillen.dev pipeline.
  build-push:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: registry.apps.vernaillen.dev/radio-vernaillen-dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.apps.vernaillen.dev
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # load: true keeps the image local so we can smoke-test before pushing.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (boot the image and hit it on :3000)
        run: |
          docker run -d --name smoke -p 3000:3000 "${IMAGE}:${{ github.sha }}"
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then ok=1; break; fi
            sleep 1
          done
          echo "----- container logs -----"; docker logs smoke || true
          docker rm -f smoke >/dev/null 2>&1 || true
          [ "$ok" = "1" ] || { echo "::error::Smoke test failed — image did not serve on :3000"; exit 1; }

      - name: Push image
        run: |
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

      # Coolify pulls :latest but won't redeploy on its own — hit its deploy API
      # so the new image goes live. COOLIFY_DEPLOY_URL is the full deploy endpoint
      # incl. ?uuid=<resource-uuid>; must be reachable from GitHub-hosted runners.
      # Skipped while the secrets are unset, so pushes still go green before the
      # Coolify app for radio.vernaillen.dev exists.
      - name: Trigger Coolify redeploy
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "COOLIFY_DEPLOY_URL / COOLIFY_TOKEN not set; image pushed, skipping redeploy"
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$COOLIFY_DEPLOY_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
